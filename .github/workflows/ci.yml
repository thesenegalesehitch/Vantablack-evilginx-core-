name: VANTABLACK CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Check Python syntax
      run: |
        python -m py_compile vanta.py
        python -m py_compile campaign_templates.py
        python -m py_compile check_status.py
        python -m py_compile monitor_captures.py
    
    - name: Verify campaign templates
      run: |
        python campaign_templates.py --list

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check Docker Compose
      run: |
        docker-compose config --quiet || exit 1
