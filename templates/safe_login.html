<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTABLACK SECURITY AUDIT</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background-color: #111;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px #00ff00;
            text-align: center;
            width: 350px;
            border: 1px solid #333;
        }
        h1 {
            color: #00ff00;
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #00ff00;
            outline: none;
            box-shadow: 0 0 5px #00ff00;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00ff00;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #00cc00;
            box-shadow: 0 0 10px #00ff00;
        }
        .disclaimer {
            font-size: 10px;
            color: #555;
            margin-top: 20px;
            border-top: 1px solid #222;
            padding-top: 10px;
        }
        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛡️</div>
        <h1>Self-Audit Mode</h1>
        <p>INTERNAL SECURITY SIMULATION<br>AUTHORIZED PERSONNEL ONLY</p>
        
        <form action="/login" method="POST">
            <input type="text" name="email" placeholder="Test Email (e.g., audit@test.local)" required>
            <input type="password" name="password" placeholder="Test Password" required>
            <button type="submit">SIMULATE LOGIN</button>
        </form>

        <div class="disclaimer">
            This interface operates in a closed loop (localhost).<br>
            No data leaves this machine.<br>
            Compliance: ISO/IEC 27001 Audit Standards.
        </div>
    </div>
</body>
</html>
